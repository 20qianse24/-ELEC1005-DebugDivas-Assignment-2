Screens:
  HazardReport:
    Properties:
      OnVisible: |-
        =// Screen-specific data — scoped here, not globally
        ClearCollect(col_HazardTypes,
            {Value:"Flooding"}, {Value:"Fallen Tree"}, {Value:"Storm Damage"},
            {Value:"Road Hazard"}, {Value:"Fire"}, {Value:"Structural Damage"}
        );

        // Only used as fallback if SharePoint not yet connected
        ClearCollect(col_RecentReports,
            {HazardType:"Flooding",     Location:"Parramatta Road, Sydney",    Reporter:"Community Member", Severity:"high",   TimeAgo:"10 mins ago"},
            {HazardType:"Fallen Tree",  Location:"Pacific Highway, Newcastle", Reporter:"Community Member", Severity:"medium", TimeAgo:"25 mins ago"},
            {HazardType:"Storm Damage", Location:"George Street, Wollongong",  Reporter:"Local Resident",   Severity:"high",   TimeAgo:"1 hour ago"},
            {HazardType:"Road Hazard",  Location:"King Street, Penrith",       Reporter:"Community Member", Severity:"low",    TimeAgo:"2 hours ago"}
        );
    Children:
      - ScreenReportContainer:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(245, 245, 245, 1)
            Height: =Parent.Height - 100
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =10
            PaddingBottom: =16
            PaddingLeft: =16
            PaddingRight: =16
            PaddingTop: =16
            Width: =Parent.Width
            Y: =75
          Children:
            - Container_PageBody:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Height: =Parent.Height
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =16
                  LayoutMaxHeight: =Parent.Height
                  LayoutMinHeight: =Parent.Height
                  PaddingBottom: =2
                  PaddingTop: =4
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - Container_RecentReports:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =If(And(HazardReport.Size = ScreenSize.Small, Or(newMode, isItemSelected)), 0, 3)
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =10
                        PaddingBottom: =10
                        PaddingLeft: =10
                        PaddingRight: =10
                        PaddingTop: =10
                        Visible: =If(And(HazardReport.Size = ScreenSize.Small, Or(newMode, isItemSelected)), false, true)
