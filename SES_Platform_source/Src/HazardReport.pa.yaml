                                    - BackIcon1:
                                        Control: Button@0.0.45
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Center
                                          Appearance: ='ButtonCanvas.Appearance'.Transparent
                                          Icon: ="ArrowLeft"
                                          Layout: ='ButtonCanvas.Layout'.IconBefore
                                          OnSelect: |-
                                            =ResetForm(Form2); UpdateContext({ newMode: false, editMode: false, CurrentItem: First(Table1.SelectedItems), isItemSelected:false });
