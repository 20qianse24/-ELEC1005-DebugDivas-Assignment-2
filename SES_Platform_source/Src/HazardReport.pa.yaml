                                        Properties:
                                          AlignInContainer: =AlignInContainer.Center
                                          Appearance: ='ButtonCanvas.Appearance'.Transparent
                                          Icon: ="Edit"
                                          OnSelect: |-
                                            =UpdateContext({ editMode: true, selectedRecord: Table1.Selected })
                                          Text: ="Edit"
                                          Visible: =And(!newMode, !deleteMode)
                                          Width: =If(HazardReport.Size = ScreenSize.Small, 75, 90)
                                    - DeleteButton1:
                                        Control: Button@0.0.45
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Center
                                          Appearance: ='ButtonCanvas.Appearance'.Transparent
                                          Icon: ="Delete"
                                          OnSelect: |-
                                            =UpdateContext({ deleteMode: true, selectedRecord: Table1.Selected })
                                          Text: ="Delete"
                                          Visible: =And(!newMode, !deleteMode)
                                          Width: =If(HazardReport.Size = ScreenSize.Small, 75, 70)
