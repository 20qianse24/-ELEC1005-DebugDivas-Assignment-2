                                          Visible: =If(And(HazardReport.Size = ScreenSize.Small, !deleteMode), true, false)
                                          Width: =If(HazardReport.Size = ScreenSize.Small, 75, 96)
                                    - NewRecordButton1:
                                        Control: Button@0.0.45
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Center
                                          Appearance: ='ButtonCanvas.Appearance'.Primary
                                          Icon: ="Add"
                                          OnSelect: |-
                                            =NewForm(Form2); UpdateContext({ newMode: true })
                                          Text: ="New"
                                          Visible: =If(HazardReport.Size = ScreenSize.Small, false, And(!newMode, !deleteMode))
                                          Width: =If(HazardReport.Size = ScreenSize.Small, 75, 96)
                                    - EditButton1:
