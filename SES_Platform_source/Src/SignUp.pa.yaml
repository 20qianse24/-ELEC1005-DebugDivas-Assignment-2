Screens:
  SignUp:
    Properties:
      OnVisible: |-
        =Set(labeltxt, false);
        NewForm(SignUpForm);
    Children:
      - SignUpContainer:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =16
            LayoutJustifyContent: =LayoutJustifyContent.Center
            PaddingBottom: =30
            PaddingLeft: =50
            PaddingRight: =50
            PaddingTop: =50
            Width: =Parent.Width
          Children:
            - Image1_2:
                Control: Image@2.2.3
                Properties:
                  Image: ='NSW_SES_Logo.svg'
                  Width: =200
                  X: =156
                  Y: =36
            - Create Account:
                Control: ModernText@1.0.0
                Properties:
                  Align: =Align.Center
                  AutoHeight: =true
                  FontWeight: =FontWeight.Bold
                  Height: =66
                  Size: =30
                  Text: ="Create Your Account"
                  Width: =388
                  X: =62
                  Y: =97
            - Instruction_2:
                Control: ModernText@1.0.0
                Properties:
                  Align: =Align.Center
                  Height: =40
                  Size: =20
                  Text: ="Join the Volunteer Network"
                  Width: =392
                  X: =60
                  Y: =149
            - SignUpForm:
                Control: Form@2.4.4
                Layout: Vertical
                Properties:
                  DataSource: =Users
                  DefaultMode: =FormMode.New
                  Height: =Parent.Height
                  LayoutMinHeight: =
                  OnSuccess: |
                    =
                    ForAll(
                        selectedSkills As q,
                        Patch(
                            UserQualifications,
                            Defaults(UserQualifications),
                            {
                                UserId: SignUpForm.LastSubmit.ID,
                                QualificationId:
                                    LookUp(
                                        Qualifications,
                                        Title = q.Title
                                    ).ID
                            }
                        )
                    );

                    Notify("Sign up successful, please login.", NotificationType.Success);

                    ResetForm(SignUpForm);
                    Navigate(LoginScreen);
                  Width: =1280
                  X: =40
                  Y: =2
                Children:
                  - FirstName_DataCard2:
                      Control: TypedDataCard@1.0.7
                      Variant: TextualEdit
                      Properties:
