            - Button1_2:
                Control: ModernButton@1.0.0
                Properties:
                  BasePaletteColor: =RGBA(5, 102, 178, 1)
                  Height: =35
                  IconStyle: =IconStyle.Filled
                  OnSelect: "=If(\n    !SignUpForm.Valid,\n    Notify(\"Please complete all required fields.\", NotificationType.Error),\n\n    If(\n        !IsMatch(\n            SignUpForm.Updates.Email,\n            \"^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$\"\n        ),\n\n        Notify(\"Please enter a valid email address.\", NotificationType.Error),\n\n        \n            // ✅ VERY IMPORTANT: capture selected skills BEFORE submit\n            Set(\n                selectedSkills,\n                cmbSkills.SelectedItems\n            );\n\n            SubmitForm(SignUpForm)\n        )\n    )"
